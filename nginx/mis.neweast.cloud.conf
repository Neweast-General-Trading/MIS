server {
    if ($host = mis.neweast.cloud) {
        return 301 https://$host$request_uri;
    }

    listen 80;
    server_name mis.neweast.cloud;
    return 404;
}

server {
    listen 443 ssl;
    server_name mis.neweast.cloud;

    root /var/www/mis-dashboard;
    index index.html;

    location = /sys-status {
        return 301 /sys-status/;
    }

    location /sys-status/api/ {
        proxy_pass http://127.0.0.1:4020/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 90s;
    }

    location /sys-status/ {
        try_files $uri $uri/ /sys-status/index.html;
    }

    location = /WLD {
        return 301 /WorkLoadAnalysis/;
    }

    location /WLD/ {
        return 301 /WorkLoadAnalysis/;
    }

    location = /WorkLoadAnalysis {
        return 301 /WorkLoadAnalysis/;
    }

    location /WorkLoadAnalysis/ {
        try_files $uri $uri/ /WorkLoadAnalysis/index.html;
    }

    location = /WLA {
        return 301 /WLA/;
    }

    location /WLA/api/ {
        client_max_body_size 40M;
        proxy_pass http://127.0.0.1:5031/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    location /WLA/ {
        try_files $uri $uri/ /WLA/index.html;
    }

    location = /c-charge {
        return 301 /c-charge/;
    }

    location /c-charge/api/ {
        proxy_pass http://127.0.0.1:5037/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 90s;
    }

    location /c-charge/ {
        try_files $uri $uri/ /c-charge/index.html;
    }

    location = /AttendanceDiscrepancy {
        return 301 /AttendanceDiscrepancy/;
    }

    location /AttendanceDiscrepancy/ {
        try_files $uri $uri/ /AttendanceDiscrepancy/index.html;
    }

    location = /hq-attendance {
        return 301 /hq-attendance/;
    }

    location /hq-attendance/ {
        try_files $uri $uri/ /hq-attendance/index.html;
    }

    location = /PFB {
        return 301 /PFB/;
    }

    location /PFB/ {
        try_files $uri $uri/ /PFB/index.html;
    }

    location = /ksa/intercompany {
        return 301 /ksa/intercompany/;
    }

    location /ksa/intercompany/ {
        try_files $uri $uri/ /ksa/intercompany/index.html;
    }

    location = /ksa/vehicle-sales {
        return 301 /ksa/vehicle-sales/;
    }

    location /ksa/vehicle-sales/ {
        try_files $uri $uri/ /ksa/vehicle-sales/index.html;
    }

    location = /ne02-approval {
        return 301 /ne02-approval/;
    }

    location /ne02-approval/ {
        try_files $uri $uri/ /ne02-approval/index.html;
    }

    location = /audit-log {
        return 301 /audit-log/;
    }

    location /audit-log/ {
        proxy_pass http://127.0.0.1:4055/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Prefix /audit-log;
        proxy_read_timeout 120s;
    }

    location = /audit-trail {
        return 301 /audit-log/;
    }

    location /audit-trail/ {
        return 301 /audit-log/;
    }

    location = /warehouse/dts {
        return 301 /warehouse/dts/;
    }

    location /warehouse/dts/ {
        try_files $uri $uri/ /warehouse/dts/index.html;
    }

    location ~ ^/PayrollElements(/|$) {
        return 404;
    }

    location = /ebilling {
        return 301 /ebilling/;
    }

    location /ebilling/api/ {
        client_max_body_size 500M;
        proxy_pass http://127.0.0.1:5041/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    location /ebilling/folder/ {
        try_files $uri $uri/ /ebilling/folder/index.html;
        add_header Cache-Control "no-store, no-cache, must-revalidate" always;
    }

    location /ebilling/approval-request/ {
        try_files $uri $uri/ /ebilling/approval-request/index.html;
        add_header Cache-Control "no-store, no-cache, must-revalidate" always;
    }

    location /ebilling/settings/ {
        try_files $uri $uri/ =404;
        add_header Cache-Control "no-store, no-cache, must-revalidate" always;
    }

    location /ebilling/ {
        try_files $uri $uri/ /ebilling/index.html;
        add_header Cache-Control "no-store, no-cache, must-revalidate" always;
    }

    location = /server-health {
        return 301 /server-health/;
    }
    location /server-health/ {
        auth_basic "Server health";
        auth_basic_user_file /etc/nginx/.htpasswd-server-health;
        proxy_pass http://127.0.0.1:4059/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 60s;
        add_header Cache-Control "no-store" always;
        add_header X-Robots-Tag "noindex, nofollow" always;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    ssl_certificate /etc/letsencrypt/live/mis.neweast.cloud/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/mis.neweast.cloud/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;
}
