<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="robots" content="noindex, nofollow" />
  <title>KYC Flow · NEWEAST</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,400;0,9..40,500;0,9..40,600;0,9..40,700&display=swap" rel="stylesheet" />
  <style>
    :root {
      --bg: #f4f6f8; --card: #fff; --line: #e2e8f0; --text: #0f172a; --muted: #64748b;
      --blue: #2563eb; --green: #047857; --red: #b91c1c; --amber: #b45309;
    }
    * { box-sizing: border-box; }
    body { margin: 0; font-family: "DM Sans", system-ui, sans-serif; background: var(--bg); color: var(--text); }
    .app { max-width: 920px; margin: 0 auto; padding: 1rem 1.1rem 7.5rem; }
    .top {
      display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: .8rem;
      background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: .85rem 1.1rem; margin-bottom: 1rem;
    }
    .brand { display: flex; align-items: center; gap: .8rem; }
    .brand img { height: 38px; }
    .eyebrow { margin: 0; font-size: .68rem; font-weight: 700; letter-spacing: .06em; text-transform: uppercase; color: var(--blue); }
    h1 { margin: .12rem 0 0; font-size: 1.12rem; }
    .badge { font-size: .72rem; color: var(--muted); background: #f1f5f9; padding: .3rem .6rem; border-radius: 8px; }
    .intro { background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: .9rem 1.1rem; margin-bottom: 1rem; }
    .intro p { margin: 0; line-height: 1.5; color: #334155; font-size: .92rem; }
    .path { display: grid; grid-template-columns: repeat(6, 1fr); gap: .4rem; margin-bottom: 1rem; }
    .path button {
      border: 1px solid #bfdbfe; background: #eff6ff; color: #1d4ed8; border-radius: 999px;
      padding: .42rem .2rem; font: inherit; font-size: .72rem; font-weight: 600; cursor: pointer;
    }
    .path button.on { background: #2563eb; border-color: #2563eb; color: #fff; }
    .path button.done { background: #ecfdf5; border-color: #6ee7b7; color: #047857; }
    .path button:disabled { opacity: .45; cursor: not-allowed; }
    .flow { position: relative; padding-left: 1.35rem; }
    .flow::before { content: ""; position: absolute; left: 11px; top: 10px; bottom: 10px; width: 2px; background: #cbd5e1; }
    .node { position: relative; margin-bottom: .55rem; }
    .card {
      position: relative; z-index: 1; background: var(--card); border: 1px solid var(--line);
      border-radius: 14px; padding: .85rem 1rem; margin-left: .35rem; opacity: .42; transform: scale(.985);
      transition: opacity .2s ease, transform .2s ease, box-shadow .2s ease, border-color .2s ease;
    }
    .card.done { opacity: .88; }
    .card.on { opacity: 1; transform: none; border-color: #93c5fd; box-shadow: 0 10px 28px rgba(37,99,235,.12); }
    .card.locked { pointer-events: none; }
    .dot {
      position: absolute; left: -1.28rem; top: 1.15rem; width: 14px; height: 14px; border-radius: 99px;
      background: #94a3b8; border: 3px solid #e2e8f0; z-index: 2;
    }
    .card.on .dot { background: var(--blue); border-color: #dbeafe; }
    .card.done .dot { background: var(--green); border-color: #a7f3d0; }
    .card.stop-end .dot { background: var(--red); border-color: #fecaca; }
    .meta { display: flex; flex-wrap: wrap; gap: .4rem .7rem; align-items: center; margin-bottom: .3rem; }
    .num { font-size: .72rem; font-weight: 700; color: var(--blue); background: #eff6ff; padding: .15rem .45rem; border-radius: 6px; }
    .who { font-size: .78rem; font-weight: 600; color: var(--muted); }
    .card h2 { margin: 0 0 .3rem; font-size: 1.02rem; }
    .card p { margin: 0; font-size: .9rem; line-height: 1.5; color: #334155; }
    .detail { display: none; margin-top: .55rem; }
    .card.on .detail, .card.done .detail { display: block; }
    .actions { display: flex; flex-wrap: wrap; gap: .45rem; margin-top: .75rem; }
    .btn {
      border: 1px solid var(--line); background: #fff; border-radius: 10px; padding: .55rem .85rem;
      font: inherit; font-size: .85rem; font-weight: 600; cursor: pointer; min-height: 42px;
    }
    .btn:hover { background: #f8fafc; }
    .btn.go { background: var(--green); border-color: var(--green); color: #fff; }
    .btn.stop { background: var(--red); border-color: var(--red); color: #fff; }
    .btn.alt { background: #b45309; border-color: #b45309; color: #fff; }
    .btn.ghost { color: var(--muted); }
    .hint { margin-top: .55rem; font-size: .78rem; color: var(--muted); }
    .outcome {
      display: none; margin-top: .7rem; border-radius: 10px; padding: .7rem .8rem; font-size: .88rem; font-weight: 600;
    }
    .outcome.show { display: block; }
    .outcome.ok { background: #ecfdf5; color: var(--green); }
    .outcome.bad { background: #fef2f2; color: var(--red); }
    .dock {
      position: fixed; left: 0; right: 0; bottom: 0; z-index: 20;
      background: rgba(255,255,255,.94); border-top: 1px solid var(--line);
      padding: .7rem 1rem calc(.7rem + env(safe-area-inset-bottom));
    }
    .dock-inner { max-width: 920px; margin: 0 auto; display: flex; flex-wrap: wrap; gap: .5rem; align-items: center; justify-content: space-between; }
    .status { font-size: .85rem; color: var(--muted); }
    .status b { color: var(--text); }
    .trail { font-size: .75rem; color: var(--muted); }
    @media (max-width: 720px) {
      .path { grid-template-columns: repeat(3, 1fr); }
      .app { padding: .7rem .7rem 8rem; }
    }
  </style>
</head>
<body>
  <div class="app">
    <header class="top">
      <div class="brand">
        <img src="logo.png" alt="NEWEAST" />
        <div>
          <p class="eyebrow">Interactive process · walk it</p>
          <h1>Customer KYC / Lead Onboarding</h1>
        </div>
      </div>
      <span class="badge">Closes in SAP B1</span>
    </header>

    <section class="intro">
      <p>Walk the live path. Tap Continue, Approve, Reject or Escalate on the current step. The next box opens only after the one before it. <a href="guide/">Walkthrough video</a>.</p>
    </section>

    <nav class="path" id="path"></nav>
    <div class="flow" id="flow"></div>
  </div>

  <div class="dock">
    <div class="dock-inner">
      <div>
        <div class="status" id="status"></div>
        <div class="trail" id="trail"></div>
      </div>
      <div class="actions" style="margin:0">
        <button class="btn ghost" type="button" id="restart">Start over</button>
      </div>
    </div>
  </div>

  <script>
    const steps = [
      { id: "1", chip: "1 Lead", title: "Create the lead", who: "Sales creator",
        text: "Sales opens a lead: master data, credit limit, payment terms, address and attachments. The system gives a REQNO.",
        actions: [{ id: "next", label: "Lead created · send KYC link", kind: "go", to: "2" }] },
      { id: "2", chip: "2 KYC form", title: "Customer completes the KYC form", who: "Customer · email and WhatsApp",
        text: "Internal user sends the KYC link. The customer fills the form, attaches files and signs. Answers land on the internal review screens.",
        actions: [{ id: "next", label: "Customer submitted · send to Sales", kind: "go", to: "3" }] },
      { id: "3", chip: "3 Sales", title: "Sales representative review", who: "Sales approver",
        text: "Sales checks the lead and the completed KYC.",
        actions: [
          { id: "ok", label: "Approve · to Manager", kind: "go", to: "4" },
          { id: "no", label: "Reject · stop", kind: "stop", to: "stop", why: "Stopped at Sales. Request is closed." }
        ] },
      { id: "4", chip: "4 Manager", title: "Manager approval", who: "Sales Manager",
        text: "Manager reviews the pack. If approved, the system rebuilds the Finance matrix and notifies Lead Approval.",
        actions: [
          { id: "ok", label: "Approve · to Finance", kind: "go", to: "5" },
          { id: "no", label: "Reject · stop", kind: "stop", to: "stop", why: "Stopped at Sales Manager. Request is closed." }
        ] },
      { id: "5", chip: "5 Finance", title: "Finance matrix, in order", who: "Finance / credit-control",
        text: "Approvers review everything: master, KYC, attachments, credit limit and payment terms. If this person is not last, approve only sends it to the next person in this same step.",
        actions: [
          { id: "nextPerson", label: "Not last · next Finance person", kind: "go", to: "5", note: "Still in Finance. Next matrix approver." },
          { id: "ok", label: "Last · approve to SAP B1", kind: "go", to: "8" },
          { id: "esc", label: "Last · escalate", kind: "alt", to: "6" },
          { id: "no", label: "Reject · stop", kind: "stop", to: "stop", why: "Stopped at Finance. Request is closed." }
        ] },
      { id: "6", chip: "6 Escalate", title: "Escalate", who: "Last Finance approver",
        text: "Pick a handler from Escalation Master. Status becomes Escalated. Email and Teams go to that person.",
        actions: [{ id: "next", label: "Handler notified · they decide", kind: "alt", to: "7" }] },
      { id: "7", chip: "7 Decision", title: "Escalation decision", who: "Escalation handler",
        text: "Handler reviews the full pack. Requester is notified either way.",
        actions: [
          { id: "ok", label: "Approve · to SAP B1", kind: "go", to: "8" },
          { id: "no", label: "Reject · stop", kind: "stop", to: "stop", why: "Stopped at escalation. Request is closed." }
        ] },
      { id: "8", chip: "8 SAP B1", title: "Close and write to SAP B1", who: "System · SAP B1 customer master",
        text: "Credit limit, payment terms and customer code are written to SAP B1. The lead becomes an active customer.",
        actions: [], end: "ok", endText: "Done. Customer is active in SAP B1." }
    ];

    const byId = Object.fromEntries(steps.map((s) => [s.id, s]));
    const pathIds = ["1", "2", "3", "4", "5", "8"];
    let current = "1";
    let visited = ["1"];
    let ended = null;

    const flow = document.getElementById("flow");
    const path = document.getElementById("path");
    const status = document.getElementById("status");
    const trail = document.getElementById("trail");

    path.innerHTML = pathIds.map((id) => `<button type="button" data-chip="${id}">${byId[id].chip}</button>`).join("");

    flow.innerHTML = steps.map((s) => `
      <article class="node" id="n${s.id}">
        <div class="card" data-card="${s.id}">
          <i class="dot"></i>
          <div class="meta"><span class="num">${s.id}</span><span class="who">${s.who}</span></div>
          <h2>${s.title}</h2>
          <p>${s.text}</p>
          <div class="detail">
            <div class="actions" data-actions="${s.id}"></div>
            <p class="hint" data-hint="${s.id}"></p>
            <div class="outcome" data-out="${s.id}"></div>
          </div>
        </div>
      </article>
    `).join("");

    function paint() {
      steps.forEach((s) => {
        const card = document.querySelector(`[data-card="${s.id}"]`);
        const actions = document.querySelector(`[data-actions="${s.id}"]`);
        const hint = document.querySelector(`[data-hint="${s.id}"]`);
        const out = document.querySelector(`[data-out="${s.id}"]`);
        const seen = visited.includes(s.id);
        const on = current === s.id && !ended;
        card.className = "card" + (on ? " on" : seen ? " done" : " locked");
        if (ended && current === s.id && ended !== "ok") card.classList.add("stop-end");
        if (ended === "ok" && s.id === "8") card.classList.add("on");
        actions.innerHTML = "";
        hint.textContent = "";
        out.className = "outcome";
        if (on) {
          s.actions.forEach((a) => {
            const b = document.createElement("button");
            b.type = "button";
            b.className = "btn " + (a.kind === "go" ? "go" : a.kind === "stop" ? "stop" : "alt");
            b.textContent = a.label;
            b.onclick = () => choose(a);
            actions.appendChild(b);
          });
        }
        if (ended && s.id === current) {
          out.className = "outcome show " + (ended === "ok" ? "ok" : "bad");
          out.textContent = ended === "ok" ? s.endText : ended;
        }
      });
      path.querySelectorAll("button").forEach((btn) => {
        const id = btn.dataset.chip;
        btn.className = id === current ? "on" : visited.includes(id) ? "done" : "";
        btn.disabled = !visited.includes(id);
        btn.onclick = () => jump(id);
      });
      const now = byId[current];
      status.innerHTML = ended
        ? (ended === "ok" ? "<b>Finished in SAP B1</b>" : "<b>Request stopped</b>")
        : `Now on <b>${now.chip}</b> · ${now.who}`;
      trail.textContent = "Path: " + visited.map((id) => byId[id].chip).join(" → ");
      document.getElementById("n" + current)?.scrollIntoView({ behavior: "smooth", block: "center" });
    }

    function choose(a) {
      if (a.kind === "stop") {
        ended = a.why;
        paint();
        return;
      }
      if (a.to === current && a.note) {
        document.querySelector(`[data-hint="${current}"]`).textContent = a.note;
        return;
      }
      current = a.to;
      if (!visited.includes(current)) visited.push(current);
      const next = byId[current];
      if (next.end === "ok") ended = "ok";
      paint();
    }

    function jump(id) {
      if (!visited.includes(id) || ended) return;
      current = id;
      const cut = visited.indexOf(id);
      visited = visited.slice(0, cut + 1);
      ended = null;
      paint();
    }

    document.getElementById("restart").onclick = () => {
      current = "1"; visited = ["1"]; ended = null; paint();
    };

    paint();
  </script>
</body>
</html>
