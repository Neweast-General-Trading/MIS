<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>NEWEAST · KYC Walkthrough</title>
  <style>
    body { margin: 0; font-family: Arial, sans-serif; background: #1e1818; color: #fff; }

    header img { height: 34px; filter: brightness(0) invert(1); }

    video { display: block; width: 100%; border-radius: 12px; background: #000; }
    p { text-align: center; color: #cfc6c6; font-size: 15px; }
    a { color: #f3b4b5; }
  </style>
</head>
<body>
  <header>
    <img src="logo.png" alt="NEWEAST" />
    <span>Know Your Customer · Walkthrough</span>
  </header>
  <div class="grid">
    <section>
      <h2>English</h2>
      <video controls playsinline preload="metadata">
        <source src="NEWEAST-KYC-Walkthrough-EN.mp4" type="video/mp4" />
        <track kind="subtitles" src="NEWEAST-KYC-Walkthrough-EN.srt" srclang="en" label="English" default />
      </video>
      <p><a href="NEWEAST-KYC-Walkthrough-EN.mp4">Download English MP4</a></p>
    </section>
    <section>
      <h2>العربية</h2>

        <track kind="subtitles" src="NEWEAST-KYC-Walkthrough-AR.srt" srclang="ar" label="العربية" />
      </video>
      <p><a href="NEWEAST-KYC-Walkthrough-AR.mp4">تحميل النسخة العربية</a></p>
    </section>
  </div>

</html>
